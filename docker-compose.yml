services:
  training:
    build:
      context: ./backend
    image: backend_training
    ports:
      - "8000:8000"
    volumes:
      - ./backend/best_performance:/backend/best_performance
    env_file:
      - ./backend/.env.local
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./backend
    image: backend
    env_file:
      - ./backend/.env.local
    ports:
      - "8001:8001"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 25s

  frontend_test:
    build: ./frontend
    image: frontend_test
    depends_on:
      backend:
        condition: service_healthy
    command: ["npm", "run", "test"]

  frontend:
    build:
      context: ./frontend
    image: frontend
    ports:
      - "3000:3000"
    depends_on:
      - frontend_test
