name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm run test -- --run

  deploy:
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install dependencies
        run: npm ci

      - name: build frontend
        run: |
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} npm run build

      - name: GCP auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: upload dist/ to cloud storage
        run: |
          gsutil -m rsync -d -r dist gs://salary-prediction-frontend

      - name: cache assets
        run: |
          gsutil -m setmeta -h "Cache-Control:public,max-age=31536000,immutable" gs://salary-prediction-frontend/assets/**

      - name: Disable cache for index.html
        run: |
          gsutil setmeta -h "Cache-Control:no-cache" gs://salary-prediction-frontend/index.html
