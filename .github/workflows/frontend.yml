name: Frontend CI/CD

on:
  push:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4

      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm run test -- --run

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4

      - name: install dependencies
        run: npm ci

      - name: build frontend
        run: |
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} npm run build

      - name: GCP auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: upload dist/ to cloud storage
        run: |
          gcloud storage rsync -r dist gs://salary-prediction-frontend --delete-unmatched-destination-objects

      - name: cache assets
        run: |
          gcloud storage objects update gs://salary-prediction-frontend/assets/** \
          --cache-control="public,max-age=31536000,immutable"

      - name: disable cache for index.html
        run: |
          gcloud storage objects update gs://salary-prediction-frontend/index.html \
          --cache-control="no-cache"
